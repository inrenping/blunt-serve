name: Deploy BluntServe to Vultr

on:
  push:
    branches: ["master"] # 修正为你的主分支 master
  workflow_dispatch: # 允许你在 GitHub Actions 页面手动点击运行

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish
        # -r linux-x64 指定目标平台，--no-self-contained 使用服务器已安装的运行时
        run: dotnet publish -c Release -r linux-x64 --no-self-contained -o ./publish

      - name: Copy files to Vultr
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "publish/*"
          target: "/var/www/blunt-serve"
          strip_components: 1
          overwrite: true # 确保覆盖旧的 dll 文件

      - name: Restart Service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 使用 sudo -S 或确保 root 直接运行，重启你的 systemd 服务
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart blunt-serve.service
            sudo systemctl status blunt-serve.service --no-pager
